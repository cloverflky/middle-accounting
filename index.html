<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财务管理PDF文档管理器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: #2c3e50;
            color: #fff;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar h2 {
            padding: 20px 16px;
            font-size: 18px;
            border-bottom: 1px solid #445566;
        }
        .chapter-item {
            padding: 12px 16px 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #3a4b5c;
            transition: background 0.2s;
        }
        .chapter-item:hover {
            background-color: #3a4b5c;
        }
        .chapter-item.active {
            background-color: #165DFF;
        }
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            padding:12px 16px;
            background:#f5f7fa;
            border-bottom:1px solid #e5e7eb;
            display:flex;
            gap:10px;
            align-items:center;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding:6px 12px;
            border:none;
            background:#165DFF;
            color:white;
            border-radius:4px;
            cursor:pointer;
        }
        .toolbar button:disabled{
            background:#94a3b8;
            cursor:not-allowed;
        }
        .zoom-info{
            min-width:60px;
            text-align:center;
        }
        .pdf-container{
            flex:1;
            overflow:auto;
            background:#cccccc;
            display:flex;
            justify-content:center;
            padding:20px;
        }
        canvas{
            box-shadow: 0 2px 12px #00000040;
            image-rendering: crisp-edges;
        }
        .tip-empty{
            margin-top:40px;
            color:#666;
            font-size:16px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>财务管理 - 章节目录</h2>
        <div id="chapterList"></div>
    </div>
    <div class="main-view">
        <div class="toolbar">
            <span id="chapterTitle">请在左侧选择章节</span>
            <div>
                <button id="zoomOut">-</button>
                <span class="zoom-info"><span id="zoomPercent">140</span>%</span>
                <button id="zoomIn">+</button>
                <button id="zoomReset">重置</button>
            </div>
            <div style="margin-left:auto;">
                <button id="prevPage">上一页</button>
                <span>第 <span id="pageNum">0</span> / <span id="totalPage">0</span> 页</span>
                <button id="nextPage">下一页</button>
            </div>
        </div>
        <div class="pdf-container" id="pdfWrap">
            <div class="tip-empty">请点击左侧章节，加载对应PDF文档</div>
            <canvas id="pdfCanvas" style="display:none;"></canvas>
        </div>
    </div>
<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

// 修复：严格校验数组逗号语法
const chapters = [
    {id:1, title:"第一章：总论", pdfUrl:"./FM_chapters/01_第一章_总论.pdf"},
    {id:2, title:"第二章：财务管理基础", pdfUrl:"./FM_chapters/02_第二章_财务管理基础.pdf"},
    {id:3, title:"第三章：预算管理", pdfUrl:"./FM_chapters/03_第三章_预算管理.pdf"},
    {id:4, title:"第04章：筹资管理（上）", pdfUrl:"./FM_chapters/04_第四章_筹资管理（上）.pdf"},
    {id:5, title:"第05章：筹资管理（下）", pdfUrl:"./FM_chapters/05_第五章_筹资管理（下）.pdf"},
    {id:6, title:"第06章：投资管理", pdfUrl:"./FM_chapters/06_第六章_投资管理.pdf"},
    {id:7, title:"第07章：营运资金管理", pdfUrl:"./FM_chapters/07_第七章_营运资金管理.pdf"},
    {id:8, title:"第08章：成本管理", pdfUrl:"./FM_chapters/08_第八章_成本管理.pdf"},
    {id:9, title:"第09章：收入与分配管理", pdfUrl:"./FM_chapters/09_第九章_收入与分配管理.pdf"},
    {id:10,title:"第10章：财务分析与评价", pdfUrl:"./FM_chapters/10_第十章_财务分析与评价.pdf"},
    {id:11,title:"第11章：公式大全", pdfUrl:"./FM_chapters/【BT教育】2026年中级 财务管理 公式大全（7.24更新）.pdf"},
    {id:12,title:"第12章：高效刷题法", pdfUrl:"./FM_chapters/【BT课件】财管通关秘法：高效刷题法.pdf"},
    {id:13,title:"第13章：价值评估", pdfUrl:"./FM_chapters/【BT课件】掌握价值评估原理，轻松搞定财管大题.pdf"},
    {id:14,title:"第14章：主观题汇总", pdfUrl:"./FM_chapters/【BT教育】2026年中级 财务管理 主观题汇总（8.11更新）.pdf"}
];

const chapterListDom = document.getElementById('chapterList');
const chapterTitleDom = document.getElementById('chapterTitle');
const pdfCanvas = document.getElementById('pdfCanvas');
const ctx = pdfCanvas.getContext('2d');
const tipEmpty = document.querySelector('.tip-empty');
const prevBtn = document.getElementById('prevPage');
const nextBtn = document.getElementById('nextPage');
const pageNumDom = document.getElementById('pageNum');
const totalPageDom = document.getElementById('totalPage');
const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');
const zoomResetBtn = document.getElementById('zoomReset');
const zoomPercentDom = document.getElementById('zoomPercent');
const pdfWrap = document.getElementById("pdfWrap");

let currentPdfDoc = null;
let currentPage = 1;
let scale = 1.4;
const MIN_SCALE = 0.4;
const MAX_SCALE = 4.0;
const STEP = 0.15;

function updateZoomDisplay(){
    zoomPercentDom.innerText = Math.round(scale * 100);
}

function renderChapterList(){
    chapterListDom.innerHTML = '';
    chapters.forEach(ch=>{
        const chDiv = document.createElement('div');
        chDiv.className = 'chapter-item';
        chDiv.innerText = ch.title;
        chDiv.onclick = ()=>{
            document.querySelectorAll('.chapter-item').forEach(d=>d.classList.remove('active'));
            chDiv.classList.add('active');
            scale = 1.4;
            updateZoomDisplay();
            loadPdf(ch.pdfUrl, ch.title);
        }
        chapterListDom.appendChild(chDiv);
    })
    console.log("财管章节渲染完成，共", chapters.length,"条");
}

async function loadPdf(url, title){
    chapterTitleDom.innerText = title;
    tipEmpty.style.display = 'none';
    pdfCanvas.style.display = 'block';
    currentPage =1;
    try{
        const pdfDoc = await pdfjsLib.getDocument(url).promise;
        currentPdfDoc = pdfDoc;
        totalPageDom.innerText = pdfDoc.numPages;
        renderPage(currentPage);
        toggleBtn();
    }catch(err){
        alert("PDF加载失败，请检查文件路径："+ err.message);
        tipEmpty.style.display='block';
        pdfCanvas.style.display='none';
    }
}

async function renderPage(pageNo){
    const page = await currentPdfDoc.getPage(pageNo);
    const viewport = page.getViewport({scale:scale});
    const dpr = window.devicePixelRatio || 1;
    const enhanceRatio = 1.4;
    const totalRatio = dpr * enhanceRatio;
    pdfCanvas.width = viewport.width * totalRatio;
    pdfCanvas.height = viewport.height * totalRatio;
    pdfCanvas.style.width = viewport.width + "px";
    pdfCanvas.style.height = viewport.height + "px";
    ctx.setTransform(totalRatio,0,0,totalRatio,0,0);
    await page.render({canvasContext:ctx, viewport:viewport, intent:"print"}).promise;
    pageNumDom.innerText = pageNo;
    toggleBtn();
    updateZoomDisplay();
}

function toggleBtn(){
    prevBtn.disabled = currentPage <=1;
    nextBtn.disabled = currentPage >= currentPdfDoc.numPages;
}

prevBtn.onclick = ()=>{
    if(currentPage>1){ currentPage--; renderPage(currentPage); }
}
nextBtn.onclick = ()=>{
    if(currentPage < currentPdfDoc.numPages){ currentPage++; renderPage(currentPage); }
}
zoomInBtn.onclick = ()=>{
    if(!currentPdfDoc) return;
    if(scale + STEP <= MAX_SCALE){ scale += STEP; renderPage(currentPage); }
}
zoomOutBtn.onclick = ()=>{
    if(!currentPdfDoc) return;
    if(scale - STEP >= MIN_SCALE){ scale -= STEP; renderPage(currentPage); }
}
zoomResetBtn.onclick = ()=>{
    if(!currentPdfDoc) return;
    scale = 1.4; renderPage(currentPage);
}

pdfWrap.addEventListener('wheel',(e)=>{
    if(!currentPdfDoc) return;
    e.preventDefault();
    if(e.deltaY < 0){
        if(scale + STEP <= MAX_SCALE){ scale += STEP; renderPage(currentPage); }
    }else{
        if(scale - STEP >= MIN_SCALE){ scale -= STEP; renderPage(currentPage); }
    }
},{passive:false});

// 页面加载完毕执行渲染
window.onload = function(){
    renderChapterList();
    updateZoomDisplay();
}
</script>
</body>
</html>
